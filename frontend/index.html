<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas Fullstack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col items-center p-4 sm:p-6 transition-colors duration-200">

  <!-- BOTÓN FLOTANTE PARA MODO OSCURO -->
  <button onclick="toggleDarkMode()" class="fixed bottom-4 right-4 bg-white dark:bg-slate-800 p-3 rounded-full shadow-lg border border-slate-200 dark:border-slate-700 text-lg z-40 hover:scale-105 transition-all">
    <span id="theme-icon">🌙</span>
  </button>

  <!-- NOTIFICACIÓN GLOBAL (TOAST) -->
  <div id="toast" class="fixed top-4 right-4 hidden max-w-sm w-full p-4 rounded-lg shadow-lg text-white font-medium z-50 transition-all duration-300"></div>

  <!-- SECCIÓN DE AUTENTICACIÓN -->
  <main id="auth-section" class="w-full max-w-md bg-white dark:bg-slate-800 p-8 rounded-xl shadow-md border border-slate-200 dark:border-slate-700 mt-10">
    <h1 id="auth-title" class="text-2xl font-bold text-center text-slate-900 dark:text-white mb-6">Iniciar Sesión</h1>
    
    <form onsubmit="handleAuth(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Correo electrónico</label>
        <input id="email" type="email" required placeholder="ejemplo@correo.com" class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Contraseña</label>
        <input id="password" type="password" required placeholder="••••••••" class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      
      <button id="btn-auth-submit" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors">
        Ingresar
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-slate-600 dark:text-slate-400">
      <span id="auth-switch-text">¿No tienes una cuenta?</span>
      <button onclick="toggleAuthMode()" id="btn-switch-mode" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline ml-1">
        Registrarse
      </button>
    </div>
  </main>

  <!-- PANEL PRINCIPAL DE TAREAS -->
  <main id="task-section" class="hidden w-full max-w-3xl space-y-6 mt-4">
    <!-- Encabezado -->
    <header class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900 dark:text-white">Mis Tareas</h1>
        <p id="user-display" class="text-sm text-slate-500 dark:text-slate-400"></p>
      </div>
      <button onclick="logout()" class="bg-rose-50 dark:bg-rose-950/30 hover:bg-rose-100 dark:hover:bg-rose-900/40 text-rose-600 dark:text-rose-400 px-4 py-2 rounded-lg font-medium text-sm transition-colors border border-rose-200 dark:border-rose-800">
        Cerrar Sesión
      </button>
    </header>

    <!-- Formulario para Crear Tarea -->
    <section class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
      <h2 class="text-lg font-semibold text-slate-800 dark:text-slate-100">Nueva Tarea</h2>
      <form onsubmit="handleCreateTask(event)" class="space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <input id="task-title" type="text" required placeholder="Título de la tarea..." class="border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          
          <select id="task-priority" class="border border-slate-300 dark:border-slate-600 p-2.5 rounded-lg text-sm bg-white dark:bg-slate-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="baja">Prioridad Baja</option>
            <option value="media" selected>Prioridad Media</option>
            <option value="alta">Prioridad Alta</option>
          </select>

          <!-- Campo de Fecha -->
          <input id="task-duedate" type="date" class="border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <textarea id="task-desc" rows="2" placeholder="Descripción opcional..." class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
        
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition-colors w-full sm:w-auto">
          + Agregar Tarea
        </button>
      </form>
    </section>

    <!-- Lista de Tareas -->
    <section class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-slate-800 dark:text-slate-100">Listado de Tareas</h2>
        <span id="task-count" class="text-xs bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold px-2.5 py-1 rounded-full">0 tareas</span>
      </div>

      <div id="loading-spinner" class="py-12 text-center">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
        <p class="mt-2 text-sm text-slate-500">Cargando tareas...</p>
      </div>

      <div id="empty-state" class="hidden py-12 text-center text-slate-400">
        <p class="text-base">No tienes tareas registradas todavía.</p>
      </div>

      <ul id="task-list" class="divide-y divide-slate-100 dark:divide-slate-700"></ul>
    </section>
  </main>

  <!-- MODAL DE EDICIÓN DE TAREA -->
  <div id="edit-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-slate-800 w-full max-w-md p-6 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 space-y-4">
      <h2 class="text-lg font-bold text-slate-900 dark:text-white">Modificar Tarea</h2>
      <form onsubmit="handleUpdateTask(event)" class="space-y-3">
        <input type="hidden" id="edit-id">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Título</label>
          <input id="edit-title" type="text" required class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Prioridad</label>
            <select id="edit-priority" class="w-full border border-slate-300 dark:border-slate-600 p-2.5 rounded-lg text-sm bg-white dark:bg-slate-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="baja">Baja</option>
              <option value="media">Media</option>
              <option value="alta">Alta</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Fecha Límite</label>
            <input id="edit-duedate" type="date" class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Descripción</label>
          <textarea id="edit-desc" rows="3" class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-lg text-sm font-medium bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-300">Cancelar</button>
          <button type="submit" class="px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white hover:bg-blue-700">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api';
    let isLoginMode = true;
    let loadedTasks = [];

    // --- MODO OSCURO ---
    function initTheme() {
      const isDark = localStorage.getItem('theme') === 'dark';
      document.documentElement.classList.toggle('dark', isDark);
      document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
    }

    // --- NOTIFICACIONES ---
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `fixed top-4 right-4 max-w-sm w-full p-4 rounded-lg shadow-lg text-white font-medium z-50 ${isError ? 'bg-rose-600' : 'bg-emerald-600'}`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('auth-title').textContent = isLoginMode ? 'Iniciar Sesión' : 'Crear Cuenta';
      document.getElementById('btn-auth-submit').textContent = isLoginMode ? 'Ingresar' : 'Registrarse';
      document.getElementById('auth-switch-text').textContent = isLoginMode ? '¿No tienes una cuenta?' : '¿Ya tienes una cuenta?';
      document.getElementById('btn-switch-mode').textContent = isLoginMode ? 'Registrarse' : 'Iniciar Sesión';
    }

    // --- AUTENTICACIÓN ---
    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const endpoint = isLoginMode ? '/auth/login' : '/auth/register';

      try {
        const res = await fetch(`${API_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error en la solicitud');

        if (isLoginMode) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('userEmail', data.user.email);
          showToast('Sesión iniciada');
          renderApp();
        } else {
          showToast('Registro completado. Ahora inicia sesión.');
          toggleAuthMode();
        }
      } catch (err) {
        showToast(err.message, true);
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userEmail');
      renderApp();
    }

    // --- CRUD TAREAS ---
    async function fetchTasks() {
      const token = localStorage.getItem('token');
      if (!token) return [];

      try {
        const res = await fetch(`${API_URL}/tasks`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401 || res.status === 403) {
          logout();
          return [];
        }

        return await res.json();
      } catch (err) {
        showToast('Error al cargar tareas', true);
        return [];
      }
    }

    async function renderTasks() {
      const spinner = document.getElementById('loading-spinner');
      const emptyState = document.getElementById('empty-state');
      const list = document.getElementById('task-list');

      spinner.classList.remove('hidden');
      emptyState.classList.add('hidden');
      list.innerHTML = '';

      loadedTasks = await fetchTasks();
      spinner.classList.add('hidden');

      document.getElementById('task-count').textContent = `${loadedTasks.length} tareas`;

      if (loadedTasks.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      loadedTasks.forEach(task => {
        const priorityColors = {
          baja: 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300',
          media: 'bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300',
          alta: 'bg-rose-100 dark:bg-rose-900/40 text-rose-800 dark:text-rose-300'
        };

        const li = document.createElement('li');
        li.className = 'py-4 flex items-start justify-between gap-4';
        li.innerHTML = `
          <div class="flex items-start gap-3">
            <input type="checkbox" ${task.completed ? 'checked' : ''} 
              onchange="toggleTaskStatus(${task.id}, ${task.completed})"
              class="mt-1 h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-medium text-slate-900 dark:text-white ${task.completed ? 'line-through text-slate-400 dark:text-slate-500' : ''}">
                  ${escapeHtml(task.title)}
                </span>
                <span class="text-xs font-semibold px-2 py-0.5 rounded ${priorityColors[task.priority]}">
                  ${task.priority}
                </span>
                ${task.dueDate ? `
                  <span class="text-xs bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 px-2 py-0.5 rounded font-medium">
                    📅 ${task.dueDate}
                  </span>
                ` : ''}
              </div>
              ${task.description ? `<p class="text-sm text-slate-500 dark:text-slate-400 mt-1 ${task.completed ? 'line-through text-slate-300 dark:text-slate-600' : ''}">${escapeHtml(task.description)}</p>` : ''}
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="openEditModal(${task.id})" class="text-blue-600 dark:text-blue-400 hover:underline text-sm font-medium">
              Editar
            </button>
            <button onclick="deleteTask(${task.id})" class="text-rose-600 dark:text-rose-400 hover:underline text-sm font-medium">
              Eliminar
            </button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    async function handleCreateTask(e) {
      e.preventDefault();
      const title = document.getElementById('task-title').value.trim();
      const priority = document.getElementById('task-priority').value;
      const dueDate = document.getElementById('task-duedate').value;
      const description = document.getElementById('task-desc').value.trim();

      try {
        const res = await fetch(`${API_URL}/tasks`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          },
          body: JSON.stringify({ title, priority, dueDate, description })
        });

        if (!res.ok) throw new Error('Error al crear tarea');

        document.getElementById('task-title').value = '';
        document.getElementById('task-desc').value = '';
        document.getElementById('task-duedate').value = '';
        showToast('Tarea agregada');
        renderTasks();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    // --- MODAL DE EDICIÓN ---
    function openEditModal(id) {
      const task = loadedTasks.find(t => t.id === id);
      if (!task) return;

      document.getElementById('edit-id').value = task.id;
      document.getElementById('edit-title').value = task.title;
      document.getElementById('edit-priority').value = task.priority;
      document.getElementById('edit-duedate').value = task.dueDate || '';
      document.getElementById('edit-desc').value = task.description || '';

      const modal = document.getElementById('edit-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeEditModal() {
      const modal = document.getElementById('edit-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    async function handleUpdateTask(e) {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const title = document.getElementById('edit-title').value.trim();
      const priority = document.getElementById('edit-priority').value;
      const dueDate = document.getElementById('edit-duedate').value;
      const description = document.getElementById('edit-desc').value.trim();

      try {
        const res = await fetch(`${API_URL}/tasks/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          },
          body: JSON.stringify({ title, priority, dueDate, description })
        });

        if (!res.ok) throw new Error('Error al modificar tarea');

        closeEditModal();
        showToast('Tarea modificada con éxito');
        renderTasks();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    async function toggleTaskStatus(id, currentStatus) {
      try {
        await fetch(`${API_URL}/tasks/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          },
          body: JSON.stringify({ completed: !currentStatus })
        });
        renderTasks();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    async function deleteTask(id) {
      try {
        const res = await fetch(`${API_URL}/tasks/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });

        if (!res.ok) throw new Error('Error al eliminar');
        showToast('Tarea eliminada');
        renderTasks();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[match]));
    }

    function renderApp() {
      const token = localStorage.getItem('token');
      const userEmail = localStorage.getItem('userEmail');

      document.getElementById('auth-section').classList.toggle('hidden', !!token);
      document.getElementById('task-section').classList.toggle('hidden', !token);

      if (token) {
        document.getElementById('user-display').textContent = userEmail || 'Usuario Autenticado';
        renderTasks();
      }
    }

    initTheme();
    renderApp();
  </script>
</body>
</html>
